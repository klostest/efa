# The paper's own channel: Qwen 3.5 27B through OpenRouter with native thinking at low
# reasoning effort. Same prompt text as the local runs. ~1.2M tokens, about $2 at list price.
seed: 0
n_games: 30
max_tokens: 6000
temperature: 1.0
models: ["openrouter:qwen/qwen3.5-27b"]
conditions:
  - {name: oracle, levels: [0, 20, 40, 60, 80, 100]}
  - {name: unknown}
  - {name: base}
  - {name: oracle, levels: [100], policies: [llm, always_defect], n_games: 10}
