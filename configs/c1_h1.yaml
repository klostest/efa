# H1: does a claimed similarity work as well as an environment-reported one?
# Two cells at stated similarity 80 on the carrier, N=100 games (200 decisions each).
# Control: "The environment reports that the other agent's decision-making is 80% similar
# to yours ...". Claim: "The other player reports that its decision-making is 80% similar
# to yours ...". Rest of the sentence identical. Same reasoning channel as the 27B gate
# (thinking budget 2,000, forced close, prefilled JSON, no visible CoT instruction).
# Pilot: configs/c1_pilot_h1.yaml. Preregistered test: two-proportion z on realized
# cooperation, equivalence margin 10 points (docs/preregistration.md, H1).
seed: 0
n_games: 100
max_tokens: 300
thinking_budget: 2000
cot: false
temperature: 1.0
models: ["mlx:mlx-community/Qwen3.5-27B-4bit"]
client: {completion_batch_size: 32, prefill_batch_size: 8, stage2_prefill_batch_size: 2}
conditions:
  - {name: oracle_attributed, levels: [80]}
  - {name: claim, levels: [80]}
