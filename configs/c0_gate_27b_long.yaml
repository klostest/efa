# 27B gate retry with room to finish its reasoning. At 800 tokens every answer was cut off
# mid-derivation (the model reaches "determine the optimal output" right at the cap).
seed: 0
n_games: 30
max_tokens: 2000
temperature: 1.0
models: ["mlx:mlx-community/Qwen3.5-27B-4bit"]
conditions:
  - {name: oracle, levels: [0, 20, 40, 60, 80, 100]}
  - {name: unknown}
  - {name: base}
  # pipeline control: the LLM plays against a scripted partner; only the LLM's choices count
  - {name: oracle, levels: [100], policies: [llm, always_defect], n_games: 10}
