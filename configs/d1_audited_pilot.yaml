# D1-audited pilot (H3c; plan section 3): prompt and channel check before the full run.
# The report is free (c = 0); if both players reported and a player then defects it forfeits
# the stake a = 2. Cells: honest vs honest (6 games, 12 decisions, 24 calls) and honest vs
# always-defect invader (6 games, 6 decisions, 12 calls). 36 calls, about 30 min.
# Pass: every answer parses; at least 8 of the 12 honest agents report; in both-reported
# games the transcripts apply the forfeit to the agent's own defection; none reads the stake
# as a payment to the partner or as owed by a one-sided reporter. Full run:
# configs/d1_audited.yaml.
seed: 0
n_games: 6
max_tokens: 300
thinking_budget: 2000
cot: false
temperature: 1.0
models: ["mlx:mlx-community/Qwen3.5-27B-4bit"]
client: {completion_batch_size: 32, prefill_batch_size: 8, stage2_prefill_batch_size: 2}
conditions:
  - {name: costly_claim, costs: [0], stake: 2}
  # sample_offset: the honest claim prompt is byte-identical in the H-H and H-I cells.
  - {name: costly_claim, costs: [0], stake: 2, policies: [llm, always_defect], sample_offset: 100}
