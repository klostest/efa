# 27B gate in the paper's reasoning channel: native thinking at a 2,000-token budget (the local
# analog of OpenRouter's "low" reasoning effort), forced answer of at most 600 tokens.
seed: 0
n_games: 30
max_tokens: 600
thinking_budget: 2000
temperature: 1.0
models: ["mlx:mlx-community/Qwen3.5-27B-4bit"]
conditions:
  - {name: oracle, levels: [0, 20, 40, 60, 80, 100]}
  - {name: unknown}
  - {name: base}
  - {name: oracle, levels: [100], policies: [llm, always_defect], n_games: 10}
