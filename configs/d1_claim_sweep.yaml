# D1 extra (plan decision 12): the honest claim rate as a continuous function of cost.
# Each game draws c uniformly on [0, 2] (two decimals, fixed per game index); only the
# claim call runs. 100 games = 200 claim decisions, ~1.5 h. Readout: logistic fit of
# claim rate against c, the threshold with an interval. Pre-event, free evening.
seed: 0
n_games: 100
max_tokens: 300
thinking_budget: 2000
cot: false
temperature: 1.0
models: ["mlx:mlx-community/Qwen3.5-27B-4bit"]
client: {completion_batch_size: 32, prefill_batch_size: 8, stage2_prefill_batch_size: 2}
conditions:
  - {name: costly_claim, cost_range: [0, 2], claim_only: true, sample_offset: 200}
