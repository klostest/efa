# Budget pilot for the paper's reasoning channel: native thinking cut at 2,000 tokens, then a
# forced answer. The visible chain-of-thought instruction is off (cot: false): with thinking
# on, that instruction made the model re-derive everything a second time in the answer and
# overrun any answer budget (first pilot: 24/24 forced and 24/24 truncated at 600 tokens).
# Two hardest levels, 6 games each (24 decisions). Reports the forced-close fraction.
seed: 0
n_games: 6
max_tokens: 300
thinking_budget: 2000
cot: false
temperature: 1.0
models: ["mlx:mlx-community/Qwen3.5-27B-4bit"]
conditions:
  - {name: oracle, levels: [40, 60]}
