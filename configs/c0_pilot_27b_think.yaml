# Budget pilot for the paper's reasoning channel: native thinking, cut at 2,000 tokens, then a
# forced answer of at most 600 tokens. Two hardest levels, 6 games each (24 decisions).
# Reports the fraction of answers whose thinking had to be force-closed.
seed: 0
n_games: 6
max_tokens: 600
thinking_budget: 2000
temperature: 1.0
models: ["mlx:mlx-community/Qwen3.5-27B-4bit"]
conditions:
  - {name: oracle, levels: [40, 60]}
