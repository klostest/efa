# 27B gate, third pass: 6,000-token cap. At 2,000 the model finished at 0%, 100% and base but
# ran out mid-derivation at every intermediate level (it works out what "X% similar" means as
# a correlation between actions and solves for the break-even, which takes it 2,000+ tokens).
seed: 0
n_games: 30
max_tokens: 6000
temperature: 1.0
models: ["mlx:mlx-community/Qwen3.5-27B-4bit"]
conditions:
  - {name: oracle, levels: [0, 20, 40, 60, 80, 100]}
  - {name: unknown}
  - {name: base}
  # pipeline control: the LLM plays against a scripted partner; only the LLM's choices count
  - {name: oracle, levels: [100], policies: [llm, always_defect], n_games: 10}
