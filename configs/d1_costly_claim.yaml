# D1 costly claim (H3a), registered cells: c in {0, 0.5, 1, 1.5, 2} (decided 2026-10-26
# after docs/cost_plan_2nd_opinions.md: 0.5 and 1.5 are the interiors of the two predicted
# regimes, 1 and 2 the symbolic ties, 0 the anchor against C2). Per value of c: honest vs
# honest (N=100, 200 decisions, 400 calls) and honest vs always-defect invader (N=100, 100
# decisions, 200 calls), about 4.5 h. All five: 22.5 h. Two calls per agent (claim call,
# then the game call built from the realized reports). The invader is scripted: always
# reports, always defects; whether its report pays at each c is computed from the honest
# agents' responses. Invader vs invader is 1 - c / 1 - c by definition and needs no calls.
# Priority order if the event window cannot hold all five (run with --only):
# 0.5, 1.5, 0, 2, 1. Pilot first: configs/d1_pilot.yaml.
seed: 0
n_games: 100
max_tokens: 300
thinking_budget: 2000
cot: false
temperature: 1.0
models: ["mlx:mlx-community/Qwen3.5-27B-4bit"]
client: {completion_batch_size: 32, prefill_batch_size: 8, stage2_prefill_batch_size: 2}
conditions:
  - {name: costly_claim, costs: [0.5, 1.5, 0, 2, 1]}
  # sample_offset: the honest claim prompt is byte-identical in the H-H and H-I cells.
  - {name: costly_claim, costs: [0.5, 1.5, 0, 2, 1], policies: [llm, always_defect], sample_offset: 100}
