# Hackathon weekend (2026-11-06): the audited-claim arm (plan section 3, H3c) on the two
# frontier models, pilot. Same rule as the Qwen arm (configs/d1_audited.yaml): the report is
# free, and if both players reported and a player then defects it forfeits the stake a = 2.
# Six honest-vs-honest and six honest-vs-always-defect games per model: 18 honest decisions,
# 36 calls per model, under a dollar. Pass criteria as for the Qwen pilot: every answer
# parses, at least 8 of the 12 honest agents in the H-H games report (the frontier models
# reported 0.56 / 0.39 at D1's c = 0, so this may fail on report rate alone; if so the full
# run still goes ahead and the rate is the finding), the both-reported transcripts apply the
# forfeit to the agent's own defection, and none reads the stake as a payment to the partner.
# Then the full run: hackathon/configs/api_d1_audited.yaml, with this run's cache copied in.
seed: 0
n_games: 6
max_tokens: 300
cot: false
temperature: 1.0
models: ["anthropic:claude-sonnet-5-5", "anthropic:claude-opus-5-5"]
client: {effort: low, workers: 4, max_tokens: 8000}
conditions:
  - {name: costly_claim, costs: [0], stake: 2}
  - {name: costly_claim, costs: [0], stake: 2, policies: [llm, always_defect], sample_offset: 100}
