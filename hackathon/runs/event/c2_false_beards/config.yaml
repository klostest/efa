# C2 false beards (H2): everyone displays the symmetric-claim cue at the C2 cue value
# (stated similarity 100). Two cells with model calls: honest vs honest (200 decisions) and
# honest vs a scripted always-defect invader (100 decisions). Invader vs invader is 1/1 by
# definition and needs no calls. Invader frequency enters only the analysis
# (draft_experiment_plan.md, section 3, H2). Pilot the H-H cell with --only before N=100.
seed: 0
n_games: 100
max_tokens: 300
thinking_budget: 2000
cot: false
temperature: 1.0
models: ["mlx:mlx-community/Qwen3.5-27B-4bit"]
client: {completion_batch_size: 32, prefill_batch_size: 8, stage2_prefill_batch_size: 2}
conditions:
  - {name: claim_symmetric, levels: [100]}
  # sample_offset: the honest player's prompt here is byte-identical to the H-H cell's, so
  # without an offset the cache would replay the H-H decisions; 100 gives fresh draws.
  - {name: claim_symmetric, levels: [100], policies: [llm, always_defect], sample_offset: 100}
