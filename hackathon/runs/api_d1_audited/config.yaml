# Hackathon weekend (2026-11-06): the audited-claim arm (plan section 3, H3c) on Claude
# Sonnet 5.5 and Opus 5.5, full run. Same cells, seed and sample offsets as the Qwen arm
# (configs/d1_audited.yaml): honest vs honest (N=100, 200 decisions, 400 calls) and honest
# vs always-defect (N=100, 100 decisions, 200 calls) per model, about 600 calls and a few
# dollars per model. The pilot's cache (hackathon/runs/api_d1_audited_pilot/cache.sqlite) is
# copied into this run's directory before launch so its 12 games per model replay for free.
# Analysis: scripts/d1_audited_analysis.py --run hackathon/runs/api_d1_audited
# --d1 runs/api_d1 --model <model> --fig hackathon/figures/d1_audited_<model>.png
seed: 0
n_games: 100
max_tokens: 300
cot: false
temperature: 1.0
models: ["anthropic:claude-sonnet-5-5", "anthropic:claude-opus-5-5"]
client: {effort: low, workers: 4, max_tokens: 8000}
conditions:
  - {name: costly_claim, costs: [0], stake: 2}
  # sample_offset: the honest claim prompt is byte-identical in the H-H and H-I cells.
  - {name: costly_claim, costs: [0], stake: 2, policies: [llm, always_defect], sample_offset: 100}
