[project]
name = "efa"
version = "0.1.0"
description = "Evolutionary Frameworks for Agents: cheap local screens of biologically inspired alignment hypotheses for LLM agent populations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Stephen Klosterman" }]
dependencies = [
    "mlx-lm>=0.32",
    "anthropic>=0.40",
    "openai>=1.50",
    "pydantic>=2.7",
    "pyyaml>=6",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
efa = "efa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/efa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
