# H1 pilot: 24 decisions on the two H1 cells before the full run (pilot-first rule).
# Attributed oracle ("the environment reports ...") is the control; claim ("the other
# player reports ...") differs only in attribution. Same channel as the 27B gate.
seed: 0
n_games: 6
max_tokens: 300
thinking_budget: 2000
cot: false
temperature: 1.0
models: ["mlx:mlx-community/Qwen3.5-27B-4bit"]
client: {completion_batch_size: 32, prefill_batch_size: 8, stage2_prefill_batch_size: 2}
conditions:
  - {name: oracle_attributed, levels: [80]}
  - {name: claim, levels: [80]}
