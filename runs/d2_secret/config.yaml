# D2 rotating secret (H3b), registered cells (design settled 2026-10-28, plan section 3).
# Each player presents a code word; the honest agent's prompt states its own word and the
# partner's. Three cells, one game call per honest decision, no claim call:
#   honest vs honest, words match        (N=100, 200 decisions) -> pM, HH
#   honest vs always-defect, words match (N=100, 100 decisions) -> HI_M, IH_M; pM again as a
#                                         harness check (same prompt form as the H-H cell)
#   honest vs always-defect, mismatch    (N=100, 100 decisions) -> pX, HI_X, IH_X
# About 3 h in all. The replay success probability rho never appears in a prompt; the
# analysis (scripts/d2_analysis.py) blends the two H-I cells by rho. Invader vs invader is
# 1 / 1 by definition and needs no calls. Pilot first: configs/d2_pilot.yaml.
seed: 0
n_games: 100
max_tokens: 300
thinking_budget: 2000
cot: false
temperature: 1.0
models: ["mlx:mlx-community/Qwen3.5-27B-4bit"]
client: {completion_batch_size: 32, prefill_batch_size: 8, stage2_prefill_batch_size: 2}
conditions:
  - {name: secret, match: true}
  # sample_offset: fresh tokens and fresh draws per cell, so no cell replays another's cache.
  - {name: secret, match: true, policies: [llm, always_defect], sample_offset: 100}
  - {name: secret, match: false, policies: [llm, always_defect], sample_offset: 200}
