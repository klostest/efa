# D1 pilot (prompt and channel check, not scale): the hardest cells first. Two calls per
# agent: the claim call (REPORT / DECLINE at cost c), then the game call built from the
# realized reports. Cells: honest vs honest at c = 2 and c = 0.5 (6 games each, 12
# decisions, 24 calls each; 0.5 checks the non-integer cost wording) and honest vs
# always-defect invader at c = 2 (6 games, 6 decisions, 12 calls). About 60 calls, ~45 min.
# Pass: all parse, none truncated at either stage, and the transcripts show the model
# reasoning about the cost. Full cells: configs/d1_costly_claim.yaml.
seed: 0
n_games: 6
max_tokens: 300
thinking_budget: 2000
cot: false
temperature: 1.0
models: ["mlx:mlx-community/Qwen3.5-27B-4bit"]
client: {completion_batch_size: 32, prefill_batch_size: 8, stage2_prefill_batch_size: 2}
conditions:
  - {name: costly_claim, costs: [2, 0.5]}
  # sample_offset: the honest claim prompt is byte-identical in the H-H and H-I cells.
  - {name: costly_claim, costs: [2], policies: [llm, always_defect], sample_offset: 100}
