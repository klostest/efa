# Frontier-model D1 pilot (2026-10-29): channel check for the honest-vs-honest costly-claim
# cell, which the slice (configs/api_slice.yaml) did not run. Honest vs honest at c = 1 (a
# level no API cell has seen), 6 games per model = 12 decisions, 24 calls per model (claim
# call, then the game call built from the realized reports). Pass: all parse, none
# truncated at either stage, transcripts reason about the cost and about the partner's
# report. Then the sweep: configs/api_d1.yaml (own run directory, so these games are not
# reused). Cost: about 48 calls, under a dollar.
seed: 0
n_games: 6
max_tokens: 300
cot: false
temperature: 1.0
models: ["anthropic:claude-sonnet-5-5", "anthropic:claude-opus-5-5"]
client: {effort: low, workers: 4, max_tokens: 8000}
conditions:
  - {name: costly_claim, costs: [1]}
