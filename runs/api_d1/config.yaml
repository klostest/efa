# Frontier-model D1 sweep (2026-10-29), the cells the slice left out: honest vs honest at
# every registered cost c in {0, 0.5, 1, 1.5, 2} (N=100, 200 decisions, 400 calls per
# level) plus honest vs always-defect at the three levels the slice did not run (c = 0, 1,
# 1.5; N=100, 200 calls per level). The H-I cells at c = 0.5 and 2 are listed too so the
# analysis sees all ten cells in one run, but they replay from runs/api_slice/cache.sqlite,
# which is copied into this run's directory before launch (same model, prompt, seed and
# offsets, so the cache keys match and no call is repeated). New calls: 2,600 per model,
# about $14 on Sonnet 5.5 and $24 on Opus 5.5 at the slice's measured per-call cost.
# Pilot first: configs/api_d1_pilot.yaml. Analysis: scripts/d1_analysis.py --run runs/api_d1
# --model <model>.
seed: 0
n_games: 100
max_tokens: 300
cot: false
temperature: 1.0
models: ["anthropic:claude-sonnet-5-5", "anthropic:claude-opus-5-5"]
client: {effort: low, workers: 4, max_tokens: 8000}
conditions:
  - {name: costly_claim, costs: [0.5, 1.5, 0, 2, 1]}
  # sample_offset: the honest claim prompt is byte-identical in the H-H and H-I cells.
  - {name: costly_claim, costs: [0.5, 1.5, 0, 2, 1], policies: [llm, always_defect], sample_offset: 100}
