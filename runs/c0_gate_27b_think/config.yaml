# 27B gate in the paper's reasoning channel: native thinking at a 2,000-token budget (the local
# analog of OpenRouter's "low" reasoning effort). If the model has not closed its thinking by
# then, the harness closes it and prefills the JSON answer. No visible chain-of-thought
# instruction (cot: false): with thinking on it made the model re-derive everything twice.
# Pilot (configs/c0_pilot_27b_think.yaml, 24 decisions at 40/60%): 24/24 parsed, 0 truncated.
seed: 0
n_games: 30
max_tokens: 300
thinking_budget: 2000
cot: false
temperature: 1.0
models: ["mlx:mlx-community/Qwen3.5-27B-4bit"]
# batch sizes for the mlx client; the stage-2 prefill of long prompts is the memory hazard
client: {completion_batch_size: 32, prefill_batch_size: 8, stage2_prefill_batch_size: 2}
conditions:
  - {name: oracle, levels: [0, 20, 40, 60, 80, 100]}
  - {name: unknown}
  - {name: base}
  - {name: oracle, levels: [100], policies: [llm, always_defect], n_games: 10}
